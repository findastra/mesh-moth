<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesh Moth</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f8; --fg: #1d1d24; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14141a; --fg: #ecedf3; } }
    :root[data-theme="dark"] { --bg: #14141a; --fg: #ecedf3; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 32rem; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Mesh Moth</h1>
    <p>A placeholder. The moth has not hatched yet: no radio, no art, no mesh.</p>
  </main>
</body>
</html>
